name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查必要 Secrets
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "缺少 CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "缺少 CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [[ -n "$CLOUDFLARE_D1_DATABASE_ID" ]] || { echo "缺少 CLOUDFLARE_D1_DATABASE_ID"; exit 1; }

      - name: 注入 D1 database_id
        run: sed -i "s|REPLACE_WITH_D1_DATABASE_ID|${CLOUDFLARE_D1_DATABASE_ID}|g" wrangler.toml

      - name: 初始化 D1（空库时自动播种）
        run: npm run db:seed-if-empty -- --remote

      - name: 部署 Cloudflare Pages
        run: npm run deploy

      - name: 同步 Pages Secrets
        run: |
          if [[ -n "$AMAP_KEY" ]]; then
            echo "$AMAP_KEY" | npx wrangler pages secret put AMAP_KEY --project-name=nav
          fi
          if [[ -n "$ADMIN_TOKEN" ]]; then
            echo "$ADMIN_TOKEN" | npx wrangler pages secret put ADMIN_TOKEN --project-name=nav
          fi
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
